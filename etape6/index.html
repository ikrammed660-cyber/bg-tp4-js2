<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons - Etape 1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="table_container">
        <div id="form_container">
            <label>Nom: <input type="text" id="input_nom"></label>
            <label>Prenom: <input type="text" id="input_prenom"></label>
            <label>Points: <input type="number" id="input_points"></label>
            <button class="btn-add" onclick="ajouterPersonne()">Ajouter</button>
        </div>
        <table id="table_persons">
            <tr>
                <th>N°</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Points</th>
                <th>Select</th>
            </tr>
            <tfoot>
                <tr>
                    <td colspan="4"  id="row_count">0 ligne(s)</td>
                    <td id="total_points" class="total-cell">Total point(s) = 0</td>
                </tr>
            </tfoot>
        </table>
        <div id="container_btn">
            <button class="btn-consol" onclick="consoleTableau()">Console Tableau</button>
            <button class="btn-del" onclick="doDeleteRows()">Supprimer</button>
        </div>
         
        <script src="script.js"> </script>
    </div>
</body>

</html>
